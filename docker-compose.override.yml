# Local dev overrides: hot reload + bind-mount source
services:
  api:
    build:
      context: .
      target: builder
    volumes:
      - .:/app
      - ./data:/app/data
    environment:
      - RELOAD=true
      - LOG_LEVEL=DEBUG
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
