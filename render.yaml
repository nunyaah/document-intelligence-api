services:
  - type: web
    name: document-intelligence-api
    env: python
    buildCommand: pip install -r requirements.txt && python scripts/download_model.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: VECTOR_STORE
        value: qdrant
      - key: GROQ_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: RELOAD
        value: "false"
